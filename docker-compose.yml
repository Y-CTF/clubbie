services:
  postgres:
    image: postgres:16-alpine
    container_name: clubbie-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: clubbie
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clubbie

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clubbie-app
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:password@postgres:5432/clubbie
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - clubbie
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  clubbie:
    driver: bridge
